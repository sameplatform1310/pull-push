<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PushPull</title>
    <meta name="description" content="Log pushups and pullups." />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body data-view="log">
    <header class="topbar">
      <button id="back-btn" class="icon-btn settings-only" aria-label="Back">
        <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <h1 class="title">
        <img class="brand-icon log-only" src="icon.svg" alt="" />
        <span class="log-only">PushPull</span>
        <span class="settings-only">Settings</span>
      </h1>
      <span id="sync-status" class="sync-status"></span>
      <button id="settings-btn" class="icon-btn log-only" aria-label="Settings">
        <svg class="icon" viewBox="0 0 24 24">
          <path
            d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"
          />
        </svg>
      </button>
    </header>

    <!-- LOG VIEW -->
    <main id="timeline" class="timeline log-only"></main>

    <footer class="log-buttons log-only">
      <button class="log-btn pushup" data-type="pushup">
        <span class="log-btn-label">Pushup</span>
        <span class="log-btn-last"></span>
      </button>
      <button class="log-btn pullup" data-type="pullup">
        <span class="log-btn-label">Pullup</span>
        <span class="log-btn-last"></span>
      </button>
    </footer>

    <!-- SETTINGS VIEW -->
    <section id="settings" class="settings settings-only">
      <h2 class="group-title">Stats</h2>
      <div class="card">
        <div class="row">
          <span>Pushups</span><span id="stat-pushup" class="value"></span>
        </div>
        <div class="row">
          <span>Pullups</span><span id="stat-pullup" class="value"></span>
        </div>
        <div class="row">
          <span>Tracking since</span><span id="stat-since" class="value"></span>
        </div>
      </div>

      <h2 class="group-title">Appearance</h2>
      <div class="card">
        <div class="row">
          <span>Theme</span>
          <div class="segmented" role="group" aria-label="Theme">
            <button data-theme-choice="light" aria-label="Light">
              <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
                />
              </svg>
            </button>
            <button data-theme-choice="dark" aria-label="Dark">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
              </svg>
            </button>
            <button data-theme-choice="system" aria-label="System">
              <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="3" width="20" height="14" rx="2" />
                <path d="M8 21h8M12 17v4" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <h2 class="group-title">Data</h2>
      <div class="card">
        <button id="export-btn" class="row">
          <span>Export backup</span>
          <svg class="icon" viewBox="0 0 24 24">
            <path
              d="M12 15V3M7 10l5 5 5-5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
            />
          </svg>
        </button>
        <button id="import-btn" class="row">
          <span>Import backup</span>
          <svg class="icon" viewBox="0 0 24 24">
            <path
              d="M12 3v12M7 8l5-5 5 5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
            />
          </svg>
        </button>
      </div>
      <p class="hint">Import adds entries from a backup file. Nothing is removed.</p>
      <input type="file" id="import-file" accept=".json,application/json" hidden />

      <p class="version">PushPull v2.1.0</p>
    </section>

    <!-- EDIT ENTRY DIALOG -->
    <dialog id="edit-dialog" class="dialog">
      <form id="edit-form" class="dialog-form" method="dialog">
        <h2 class="dialog-title" tabindex="-1" autofocus>Edit entry</h2>
        <div class="type-choice">
          <label><input type="radio" name="type" value="pushup" />Pushup</label>
          <label><input type="radio" name="type" value="pullup" />Pullup</label>
        </div>
        <div class="fields">
          <label class="field">Date<input type="date" name="date" required /></label>
          <label class="field">Time<input type="time" name="time" required /></label>
        </div>
        <div class="dialog-actions">
          <button type="button" id="delete-entry" class="btn btn-delete">
            Delete
          </button>
          <button type="button" id="cancel-edit" class="btn">Cancel</button>
          <button class="btn btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <output id="toast" class="toast"></output>
  </body>
</html>
